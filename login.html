<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/png" href="images/slogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #000;
      overflow: hidden;
      color: #fff;
    }

    /* Background video */
    .video-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Auth container */
    .auth-container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      background: rgba(0, 0, 0, 0.85);
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    .auth-box h2 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .auth-box input {
      width: 100%;
      margin: 0.6rem 0;
      padding: 0.9rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 1rem;
    }

    .auth-box input:focus {
      outline: none;
      border: 1px solid #fff;
    }

    .auth-box button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.9rem;
      background: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      color: #000;
      transition: background 0.3s;
    }

    .auth-box button:hover {
      background: #eaeaea;
    }

    .auth-box p {
      margin-top: 1.2rem;
      font-size: 0.95rem;
      color: #aaa;
    }

    .auth-box a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-box a:hover { text-decoration: underline; }

    .back-home {
      display: block;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #aaa;
      text-decoration: none;
    }
    .back-home:hover { color: #fff; }

    /* Error message */
    .error-message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #ff4d4d;
      font-weight: 500;
      display: none; /* hidden by default */
    }
    .success-message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #4dff88;
      font-weight: 500;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="images/bg.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Auth Form -->
  <div class="auth-container">
    <div class="auth-box">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Log In</button>
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
      </form>
      <p>Don't have an account? <a href="auth.html">Sign up</a></p>
      <a href="index.html#home" class="back-home">← Back to Home</a>
    </div>
  </div>

  <!-- Firebase Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCnvcDp8Elm0qoCM0cTi_2pX35ieSQYhmU",
      authDomain: "studio-5731911695-46535.firebaseapp.com",
      projectId: "studio-5731911695-46535",
      storageBucket: "studio-5731911695-46535.appspot.com",
      messagingSenderId: "379662025657",
      appId: "1:379662025657:web:a232f217392188950bac68"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle login
    const loginForm = document.getElementById("login-form");
    const errorBox = document.getElementById("error-message");
    const successBox = document.getElementById("success-message");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      successBox.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((cred) => {
          console.log("User logged in:", cred.user);
          successBox.textContent = "✅ Login successful, welcome " + cred.user.email;
          successBox.style.display = "block";
          loginForm.reset();

          setTimeout(() => {
            window.location.href = "index.html#home";
          }, 1200);
        })
        .catch((err) => {
          console.error("Login error:", err);
          errorBox.style.display = "block";

          if (err.code === "auth/user-not-found") {
            errorBox.textContent = "❌ No account found with this email.";
          } else if (err.code === "auth/wrong-password") {
            errorBox.textContent = "❌ Incorrect password.";
          } else if (err.code === "auth/invalid-email") {
            errorBox.textContent = "❌ Invalid email format.";
          } else {
            errorBox.textContent = "❌ " + err.message;
          }
        });
    });
  </script>
</body>
</html>
